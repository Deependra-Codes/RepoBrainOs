[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repobrain-research"
version = "0.1.0"
description = "Research and evaluation package for RepoBrain OS."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "RepoBrain OS" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "ruff>=0.13,<0.14",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "N", "RUF", "UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
